[package]
name = "code-ref-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
mcp_rust_sdk = "0.1.1"
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tantivy = "0.25"
tokio = { version = "1.36", features = ["macros", "rt-multi-thread"] }
tree-sitter = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
walkdir = "2.5"
